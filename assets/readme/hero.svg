<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Oases CPA for macOS</title>
  <desc id="desc">A native macOS control plane connecting a local Mac or SSH VPS to CLIProxyAPI and CPA Manager Plus.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100A"/>
      <stop offset="1" stop-color="#102016"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#15932C"/>
      <stop offset="1" stop-color="#8AF54D"/>
    </linearGradient>
    <pattern id="routes" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8AF54D" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#surface)"/>
  <rect width="1200" height="400" rx="28" fill="url(#routes)"/>
  <path d="M704 40V360" stroke="#DFF5DF" stroke-opacity=".12"/>

  <g transform="translate(58 54)">
    <g transform="translate(0 2)">
      <path d="M16 24C8 13 15 1 28 2c15 1 28 14 28 28 0 8-4 14-11 18-7 4-11 11-12 19-2 12-14 18-24 12C-2 72-2 57 8 49c6-5 12-10 13-16 1-3-1-6-5-9Z" fill="url(#brand)"/>
      <circle cx="34" cy="31" r="4" fill="#DFFFF0" fill-opacity=".72"/>
    </g>
    <text x="76" y="25" fill="#8AF54D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2">SELF-HOSTED AI GATEWAY · macOS</text>

    <text x="0" y="126" fill="#F4F8F2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="74" font-weight="760" letter-spacing="-3">Oases CPA</text>
    <text x="2" y="178" fill="#CFE0D1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="560">搭建并管理你自己的 AI API 中转站</text>
    <text x="2" y="216" fill="#8FA094" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="19">本机一键部署 · SSH / VPS · Provider · Model · API Key · Usage</text>

    <g transform="translate(2 270)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="650">
      <rect width="116" height="34" rx="17" fill="#142A1B" stroke="#8AF54D" stroke-opacity=".34"/>
      <text x="18" y="22" fill="#BFF2B8">MACOS 14+</text>
      <rect x="128" width="92" height="34" rx="17" fill="#142A1B" stroke="#8AF54D" stroke-opacity=".34"/>
      <text x="146" y="22" fill="#BFF2B8">SWIFT 6</text>
      <rect x="232" width="138" height="34" rx="17" fill="#142A1B" stroke="#8AF54D" stroke-opacity=".34"/>
      <text x="250" y="22" fill="#BFF2B8">ARM64 + X86_64</text>
    </g>
  </g>

  <g transform="translate(748 50)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="0" y="20" fill="#91A198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.4">ONE CONTROL PLANE · TWO TARGETS</text>

    <g transform="translate(0 48)">
      <rect width="164" height="72" rx="16" fill="#142019" stroke="#BBD4BE" stroke-opacity=".22"/>
      <rect x="18" y="18" width="32" height="23" rx="4" fill="none" stroke="#8AF54D" stroke-width="2"/>
      <path d="M13 48H55" stroke="#8AF54D" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="29" fill="#F0F6EF" font-size="16" font-weight="650">本机 Mac</text>
      <text x="66" y="51" fill="#819187" font-size="13">default target</text>
    </g>

    <g transform="translate(0 144)">
      <rect width="164" height="72" rx="16" fill="#142019" stroke="#BBD4BE" stroke-opacity=".22"/>
      <rect x="17" y="17" width="34" height="30" rx="5" fill="none" stroke="#75B8FF" stroke-width="2"/>
      <path d="M23 25H45M23 32H45M23 39H37" stroke="#75B8FF" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="29" fill="#F0F6EF" font-size="16" font-weight="650">SSH / VPS</text>
      <text x="66" y="51" fill="#819187" font-size="13">secure tunnel</text>
    </g>

    <path d="M174 84H226C244 84 244 132 262 132H282M174 180H226C244 180 244 132 262 132" fill="none" stroke="#4FCB61" stroke-width="2"/>
    <circle cx="282" cy="132" r="6" fill="#8AF54D"/>

    <g transform="translate(286 64)">
      <rect width="126" height="136" rx="20" fill="#18291D" stroke="#8AF54D" stroke-opacity=".48"/>
      <g transform="translate(39 18)">
        <path d="M12 20C4 10 11-1 23 1c12 2 22 12 22 24 0 7-3 12-9 16-6 3-9 9-10 15-2 10-12 14-20 9-9-6-8-18 0-25 5-4 9-8 10-13 0-2-1-5-4-7Z" fill="url(#brand)"/>
      </g>
      <text x="63" y="94" fill="#F3F7F1" font-size="16" font-weight="700" text-anchor="middle">Oases CPA</text>
      <text x="63" y="116" fill="#8DA094" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">native app</text>
    </g>

    <g transform="translate(0 250)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="412" height="64" rx="16" fill="#0B1510" stroke="#D8E7DA" stroke-opacity=".16"/>
      <circle cx="24" cy="22" r="4" fill="#63DB67"/>
      <text x="38" y="26" fill="#DDE9DE" font-size="14">CLIProxyAPI</text>
      <text x="326" y="26" fill="#8AF54D" font-size="13">:8317 /v1</text>
      <circle cx="24" cy="44" r="4" fill="#75B8FF"/>
      <text x="38" y="49" fill="#DDE9DE" font-size="14">CPA Manager Plus</text>
      <text x="333" y="49" fill="#75B8FF" font-size="13">:18317</text>
    </g>
  </g>
</svg>
