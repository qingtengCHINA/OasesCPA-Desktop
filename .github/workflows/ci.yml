name: macOS CI

# Build and test only when code or project files change. The private-string scan runs for every
# change in its own workflow (private-scan.yml), because README, docs and assets leak most.
on:
  push:
    paths:
      - '.github/**'
      - 'Package.swift'
      - 'project.yml'
      - 'Config/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'OasesCPA.xcodeproj/**'
      - 'script/**'
      - '*.entitlements'
  pull_request:
    paths:
      - '.github/**'
      - 'Package.swift'
      - 'project.yml'
      - 'Config/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'OasesCPA.xcodeproj/**'
      - 'script/**'
      - '*.entitlements'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Swift and unsigned Xcode build
    # macos-15 ships Xcode 16 (Swift 6); macos-14 defaults to Xcode 15, which cannot build
    # swift-tools-version 6.0.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          swift --version | grep -q "Swift version 6"

      - name: Check the private-string scanner contract
        run: bash script/check_no_private_contract_test.sh

      - name: Check Xcode project membership
        run: bash script/check_xcodeproj_membership.sh

      - name: Run Swift package tests
        run: swift test --scratch-path "$RUNNER_TEMP/oases-swift-test"

      - name: Build Swift package
        run: swift build --scratch-path "$RUNNER_TEMP/oases-swift-build"

      - name: Build Xcode project without signing
        run: >-
          xcodebuild
          -project OasesCPA.xcodeproj
          -scheme "Oases CPA"
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/OasesCPA-DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build

      - name: Run Xcode tests without signing
        run: >-
          xcodebuild
          -project OasesCPA.xcodeproj
          -scheme "Oases CPA"
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/OasesCPA-Xcode-Test-DerivedData"
          -destination "platform=macOS"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          test

      - name: Validate release policy contract
        run: bash script/package_release_contract_test.sh
