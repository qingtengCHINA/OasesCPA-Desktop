name: Private-string scan

# Runs for every push and pull request, with no path filter: README, docs and assets are the
# files that most often carry private strings.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A pull request is checked at its own head: the merge commit GitHub builds for it is
      # committed by GitHub, not by the contributor. The scan reads the commits since f0f2500,
      # so the whole history is fetched.
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The maintainer-only terms come from a repository secret, which GitHub does not hand to
      # pull requests from forks; without it only the generic rules run. The secret goes through
      # an environment variable into a private file that is never printed; this step must not
      # run under set -x.
      - name: Check private strings
        shell: bash
        env:
          OASES_PRIVATE_TERMS: ${{ secrets.OASES_PRIVATE_TERMS }}
        run: |
          set -euo pipefail
          require=()
          if [ -n "${OASES_PRIVATE_TERMS:-}" ]; then
            (umask 077 && printf '%s\n' "$OASES_PRIVATE_TERMS" > "$RUNNER_TEMP/private-terms")
            export OASES_PRIVATE_TERMS_FILE="$RUNNER_TEMP/private-terms"
            require=(--require-private-terms)
          else
            echo "No private terms here (a pull request from a fork, or the secret is not set): generic rules only."
            export OASES_PRIVATE_TERMS_FILE="$RUNNER_TEMP/no-private-terms"
          fi
          bash script/check-no-private.sh --tree ${require[@]+"${require[@]}"}
          # Commits since f0f2500 (the last commit before the open edition): added lines,
          # messages, and author/committer e-mails. Removed lines are never scanned. grep
          # exits 1 when nothing matches; only that status is tolerated.
          git log -p -U0 --no-color --no-ext-diff --format= f0f2500..HEAD \
            | { LC_ALL=C grep -E '^\+' || [ "$?" -eq 1 ]; } \
            | { LC_ALL=C grep -vE '^\+\+\+ ' || [ "$?" -eq 1 ]; } \
            | bash script/check-no-private.sh --stdin ${require[@]+"${require[@]}"}
          git log --format=%B f0f2500..HEAD | bash script/check-no-private.sh --stdin ${require[@]+"${require[@]}"}
          # One line per role, so the allowlist can allow GitHub's own address as committer only.
          git log --format='author: %ae%ncommitter: %ce' f0f2500..HEAD \
            | bash script/check-no-private.sh --stdin ${require[@]+"${require[@]}"}
